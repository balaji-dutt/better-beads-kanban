name: Feature Request
description: Suggest a feature or improvement for Better Beads Kanban
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This is a single-maintainer fork, so review is best-effort and may take a while.
        A request that starts from the problem has a much better chance than one that only
        names a solution — the problem is the part that can be solved a different way.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the board makes hard or slow today?
      placeholder: >
        I keep a large backlog and re-sort by priority every single time I open the board,
        because the sort resets to Updated.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work? Mockups and screenshots help — drag them in here.
      placeholder: >
        A setting for the default sort column and direction, applied on first paint.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >
        Anything you tried first, including existing settings or one of the other views
        (Kanban, Table, Tree, Graph) that almost does the job.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Use cases, related tools that do this well, or implementation notes.
    validations:
      required: false
