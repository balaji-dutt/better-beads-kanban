name: Bug Report
description: Report something in Better Beads Kanban that is broken
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        The extension never opens the issue database itself — every read and every write
        shells out to the `bd` CLI. A board that will not load is therefore often a `bd`
        problem rather than an extension one. The optional diagnostics near the bottom of
        this form are what tell the two apart, and filling them in usually saves a round trip.

        Please write the report in your own words. Two sentences describing what you saw
        are easier to act on than a long generated summary of what went wrong.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: >
        Describe the bug and the exact steps that produce it. Number the steps if there is
        more than one.
      placeholder: |
        The Columns dropdown in Table view stopped opening.

        1. Open the Kanban board on a repo with a few hundred issues
        2. Click "Table" in the toolbar
        3. Click "Columns"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      placeholder: The column visibility dropdown should open.
    validations:
      required: true

  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      description: "Help > About (Code > About Visual Studio Code on macOS). Minimum supported is 1.90.0."
      placeholder: "1.90.0"
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: Extensions panel, or the version on the VSIX you installed.
      placeholder: "2.2.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: bd-version
    attributes:
      label: bd version
      description: "Run `bd --version`."
      placeholder: "1.1.2"
    validations:
      required: false

  - type: textarea
    id: bd-info
    attributes:
      label: bd info
      description: >
        Run `bd info` in the workspace. The database path tells us which backend you are on
        (a path ending in `embeddeddolt` is Dolt; a `.jsonl` path is not), which is usually
        the first thing worth knowing. Redact the directory if it is sensitive.
      render: shell
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Two separate places, and it is worth checking both. Extension host: **View > Output**,
        then pick **Beads Kanban** from the dropdown on the right. Webview:
        **Help > Toggle Developer Tools** and copy anything red from the Console tab.
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: For anything visual, drag images in here.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: >
        Anything else — the OS version, whether it started after an upgrade, non-default
        `beadsKanban.*` settings, or how large the board is.
    validations:
      required: false
